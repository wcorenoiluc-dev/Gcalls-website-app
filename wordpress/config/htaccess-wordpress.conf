# ---------------------------------------------------------------------------
# Gcalls demo — Apache / LiteSpeed configuration for the WordPress site.
# ---------------------------------------------------------------------------
# Deploy to the document root as `.htaccess` (the file is kept here under a
# .conf name so it is visible in the repo and cannot be picked up by accident).
#
# THIS REPLACES THE REACT SPA .htaccess ENTIRELY.
# public/.htaccess in this repository routes every unmatched request to a
# single index.html. Applied to WordPress that breaks the front controller:
# WordPress needs the request to reach ITS index.php with the path intact so it
# can resolve the query. Do not merge the two files.
#
# WHERE THE RULES GO
# Saving permalinks makes WordPress rewrite everything inside its own marked
# block at the bottom of this file. Every custom rule therefore sits ABOVE that
# block, where WordPress leaves it alone.
#
# NEVER WRITE THE MARKER TEXT IN A COMMENT. WordPress finds its block by
# scanning for a line CONTAINING the marker, not by matching a line exactly, so
# a comment that quotes the marker is treated as the real thing and everything
# below it is replaced on the next permalink save. That is not hypothetical: it
# silently deleted the redirects, the security headers and the deny rules the
# first time this file was deployed. Describe the block; do not quote it.
#
# AT GO-LIVE: the X-Robots-Tag block must be removed together with the
# robots.txt policy and the "Discourage search engines" setting — never one
# without the others.
# ---------------------------------------------------------------------------

# --- Canonical scheme and host ---------------------------------------------
# One hostname answers: https, no www. Written host-agnostically so moving the
# site does not require editing this file — an edit that is forgotten is a
# redirect loop.
#
# The www rule runs first so http://www/ takes a single hop. Neither rule can
# match its own target, so there is no loop. LiteSpeed terminates TLS on this
# box, so %{HTTPS} is authoritative; the X-Forwarded-Proto condition only
# matters if a proxy is ever put in front, which speaks http to the origin and
# would otherwise redirect forever.
<IfModule mod_rewrite.c>
  RewriteEngine On

  RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
  RewriteRule ^ https://%1%{REQUEST_URI} [R=301,L]

  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !=https
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</IfModule>

# --- Headers ----------------------------------------------------------------
<IfModule mod_headers.c>
  # The demo is public but must stay out of search. This is the transport-level
  # counterpart to the robots meta tag, and the only layer that covers assets
  # fetched directly — a .webp served on its own never parses an HTML meta tag.
  Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"

  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Frame-Options "SAMEORIGIN"

  # robots.txt must be re-read, not remembered from a previous deploy.
  <FilesMatch "^robots\.txt$">
    Header always set Cache-Control "no-cache, must-revalidate"
  </FilesMatch>
</IfModule>

# --- Files that must never be served ----------------------------------------
# wp-config.php holds the database credentials. readme.html and licence files
# announce the exact WordPress version. Dotfiles and backups are never content.
#
# mod_authz_core exists on Apache 2.4+ and on LiteSpeed, which emulates it.
# Guarded so an older host skips the block instead of returning 500.
<IfModule mod_authz_core.c>
  <FilesMatch "^(wp-config\.php|readme\.html|license\.txt|licence\.txt|liesmich\.html)$">
    Require all denied
  </FilesMatch>

  <FilesMatch "(^\.|\.(bak|old|orig|save|swp|sql|sql\.gz|zip|tar|tar\.gz|log)$)">
    Require all denied
  </FilesMatch>
</IfModule>

# --- XML-RPC ----------------------------------------------------------------
# Nothing on this site uses XML-RPC: no Jetpack, no mobile app, no remote
# publishing. It is the standard target of pingback amplification and password
# spraying, so it is refused at the web server as well as inside WordPress
# (Gcalls Core disables it in PHP too — one layer can be edited away by a
# plugin, two cannot be by accident).
<IfModule mod_authz_core.c>
  <Files "xmlrpc.php">
    Require all denied
  </Files>
</IfModule>

# --- PHP execution in uploads ------------------------------------------------
# An upload directory that executes PHP turns any file-upload flaw into remote
# code execution. Nothing in uploads/ should ever be interpreted.
<IfModule mod_rewrite.c>
  RewriteRule ^wp-content/uploads/.*\.(php|phtml|php[0-9])$ - [F,L,NC]
</IfModule>

# BEGIN WordPress
# The directives between BEGIN WordPress and END WordPress are dynamically
# generated by WordPress and should only be modified via WordPress filters.
# Any changes to the directives between these markers will be overwritten.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
RewriteBase /
RewriteRule ^index\.php$ - [L]
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule . /index.php [L]
</IfModule>
# END WordPress
